telegram:
  bot_token: "123456:replace-me"
  channel_id: "@your_channel"
  admin_user_ids: []

xhs:
  cookies: "a1=replace-me; web_session=replace-me"

sources:
  keywords:
    weight: 0.7
    # Legacy single-rule mode still works:
    # rules_path: "https://gist.github.com/XXX/raw/xhs_keyword_rules.yaml"
    rules:
      - name: "A"
        weight: 0.7
        rules_path: "https://gist.github.com/XXX/raw/xhs_keyword_rules_A.yaml"
      - name: "B"
        weight: 0.3
        rules_path: "https://gist.github.com/XXX/raw/xhs_keyword_rules_B.yaml"
    search_limit_per_query: 20
    sort_type: 0
    note_type: 0
  homefeed:
    weight: 0.3
    category: "homefeed.fashion_v3"  # 推荐频道/分类 ID（支持自定义 tag/category，如 homefeed.fashion_v3 穿搭、homefeed_recommend 默认推荐）
    limit_per_page: 20
  # 批量抓取笔记详情时，相邻两次请求的间隔 = fixed_delay_seconds + random_delay_seconds 内的均匀随机值
  detail_fetch:
    fixed_delay_seconds: 7
    random_delay_seconds: 3

publishing:
  notes_per_run: 10
  telegram_retry_after_padding_seconds: 2
  note_interval_seconds: 5
  upload_live_photo: true  # false = Live Photo 按普通图片上传

debug:
  enabled: false

logging:
  level: "DEBUG"
  console_enabled: true
  file_enabled: true
  file_path: "logs/rednote2tg.log"
  max_bytes: 5242880
  retention_days: 14
  max_files: 20
  compress_rotated: true

dedup:
  ttl_days: 14

schedule:
  timezone: "Asia/Shanghai"
  interval_minutes: 50
  jitter_minutes: 10
  quiet_window:
    start: "03:00"
    end: "09:00"

storage:
  sqlite_path: "data/rednote2tg.db"
  media_temp_dir: "data/tmp_media"
